<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F12" />
    <title>CALIBER — What kind of lifter are you?</title>
    <meta
      name="description"
      content="Enter your lifts. Get your Strength Score, your percentile, and your lifter type — on one card built to post."
    />

    <!-- Open Graph / Twitter defaults (per-result tags injected by /api/r) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CALIBER" />
    <meta property="og:url" content="https://caliberlifts.app" />
    <meta property="og:title" content="CALIBER — What kind of lifter are you?" />
    <meta
      property="og:description"
      content="Enter your lifts. Get your type, your rank, and the card to prove it."
    />
    <meta name="twitter:title" content="CALIBER — What kind of lifter are you?" />
    <meta
      name="twitter:description"
      content="Enter your lifts. Get your type, your rank, and the card to prove it."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: loaded non-render-blocking (preload as style → swap to stylesheet)
         so the landing paints immediately; display=swap shows fallback text first.
         crossorigin stays on the resolved stylesheet so PNG font embedding is
         deterministic. Archivo is width 125 (Expanded) for the display weights. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,400;125,500;125,700;125,800;125,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        crossorigin="anonymous"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,400;125,500;125,700;125,800;125,900&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
